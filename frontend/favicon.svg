<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for subtle depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0c0c0f" />
    </linearGradient>

    <!-- Laser Scanning Beam Gradient (Bright White Sweep) -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 8-Bit Pixel Art Lowercase "jdm" Clip Path -->
    <clipPath id="jdmClip">
      <!-- 'j' (x: 4..8) -->
      <rect x="6" y="6" width="2" height="2" />
      <rect x="6" y="10" width="2" height="14" />
      <rect x="4" y="24" width="4" height="2" />
      <rect x="4" y="22" width="2" height="2" />

      <!-- 'd' (x: 10..16) -->
      <rect x="14" y="6" width="2" height="16" />
      <rect x="10" y="10" width="2" height="12" />
      <rect x="12" y="10" width="2" height="2" />
      <rect x="12" y="20" width="2" height="2" />

      <!-- 'm' (x: 18..28) -->
      <rect x="18" y="10" width="10" height="2" />
      <rect x="18" y="12" width="2" height="10" />
      <rect x="22" y="12" width="2" height="10" />
      <rect x="26" y="12" width="2" height="10" />
    </clipPath>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Sweeping Laser / Neon Glow Animation */
    @keyframes laserSweep {
      0% {
        transform: translateX(-24px);
      }
      45%, 55% {
        transform: translateX(36px);
      }
      100% {
        transform: translateX(36px);
      }
    }

    @keyframes ambientPulse {
      0%, 100% {
        opacity: 0.7;
        filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.3));
      }
      50% {
        opacity: 0.95;
        filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.8));
      }
    }

    .base-letters {
      fill: #ffffff;
      animation: ambientPulse 2.8s ease-in-out infinite;
    }

    .scanner {
      animation: laserSweep 2.8s ease-in-out infinite;
    }
  </style>

  <!-- Container: Dark rounded surface matching site theme with subtle border -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" stroke="#2a2a30" stroke-width="1.2" />

  <!-- Base Resting Layer: Dim neon cyan letters -->
  <g clip-path="url(#jdmClip)">
    <rect class="base-letters" x="0" y="0" width="32" height="32" />
  </g>

  <!-- Sweeping Laser Layer: Pure neon glow sweeping across the letters -->
  <g clip-path="url(#jdmClip)" filter="url(#neonGlow)">
    <rect class="scanner" x="0" y="0" width="16" height="32" fill="url(#laserBeam)" />
  </g>
</svg>

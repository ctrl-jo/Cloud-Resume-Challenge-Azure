# ============================================================
# CI/CD Pipeline — Backend (Azure Functions Python v2)
# ============================================================
# Triggers on pushes to main that modify backend/ files.
# Job 1: Build & Test — installs deps, runs pytest
# Job 2: Deploy      — packages and deploys to Azure Functions
# ============================================================

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

env:
  AZURE_FUNCTIONAPP_NAME: "func-cloud-resume-jdm"
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "backend"
  PYTHON_VERSION: "3.12"

jobs:
  # ────────────────────────────────────────────
  # Job 1: Build and Test
  # ────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m pytest backend/tests/ -v

  # ────────────────────────────────────────────
  # Job 2: Deploy to Azure Functions
  # ────────────────────────────────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install production dependencies
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"
          popd

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
